name: Roar
options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    from: 1.3.0

targets:
  roar:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: none
      - path: scripts
        buildPhase: none
      # `Roar.icns` is the only Resources/ entry that gets bundled
      # — `icon.svg` is the source of truth (regenerated via
      # `scripts/generate-icon.sh`), `Info.plist` is the bundle
      # manifest (handled by `info:` below), and
      # `roar.entitlements` is signing metadata (referenced via
      # `CODE_SIGN_ENTITLEMENTS` in the build settings). Listing
      # the icns explicitly keeps the resource phase to exactly
      # one file rather than relying on a directory-wide phase
      # plus excludes.
      - path: Resources/Roar.icns
        buildPhase: resources
      # Bundle the man page inside the .app at
      # `Contents/Resources/man/man1/roar.1`. macOS apps that ship
      # a CLI conventionally embed their man pages in the bundle
      # so `man <tool>` works once Homebrew (or any other
      # installer) adds the corresponding manpath. The Homebrew
      # cask points its `manpage` stanza at this path; users who
      # copy the .app to /Applications by hand can read the page
      # by adding the path to MANPATH manually.
      #
      # `destination: resources` is xcodegen's alias for
      # `$(CONTENTS_FOLDER_PATH)/Resources/`; `subpath: man/man1`
      # appends the conventional `man1` directory the manpath
      # utility expects.
      - path: man/roar.1
        buildPhase:
          copyFiles:
            destination: resources
            subpath: man/man1
      - path: docs
        buildPhase: none
    # The Info.plist at `Resources/Info.plist` is regenerated by
    # xcodegen from the `properties` block below. It is .gitignored
    # for that reason — `project.yml` is the source of truth.
    info:
      path: Resources/Info.plist
      properties:
        CFBundleIdentifier: io.myers.roar
        CFBundleName: Roar
        CFBundleExecutable: $(EXECUTABLE_NAME)
        # `$(MARKETING_VERSION)` is substituted by xcodebuild at
        # build time from the `MARKETING_VERSION` build setting
        # below. The release workflow overrides
        # `MARKETING_VERSION` from the git tag (`v0.1.7` →
        # `0.1.7`); local dev builds get the `0.0.0` default so
        # `roar --version` clearly says "not a release". The Swift
        # CLI reads this same Info.plist value via
        # `Bundle.main.object(forInfoDictionaryKey:)` so the
        # `--version` flag, the bundle, the git tag, and the
        # Homebrew cask all agree.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconFile: Roar
        CFBundlePackageType: APPL
        CFBundleInfoDictionaryVersion: "6.0"
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: ""
    dependencies:
      - package: ArgumentParser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: roar
        PRODUCT_BUNDLE_IDENTIFIER: io.myers.roar
        # Version source of truth. CI release builds override
        # `MARKETING_VERSION` from the git tag (`v0.1.7` →
        # `0.1.7`); CURRENT_PROJECT_VERSION (the build number) is
        # overridden similarly via the release run's GITHUB_RUN_NUMBER
        # or left at the dev default. The Info.plist's
        # CFBundleShortVersionString / CFBundleVersion both
        # reference these via the standard `$(NAME)` placeholder.
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        # Override the get-task-allow=true that Xcode auto-injects for
        # ad-hoc-signed targets; see the entitlements file for rationale.
        CODE_SIGN_ENTITLEMENTS: Resources/roar.entitlements
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        GENERATE_INFOPLIST_FILE: NO

  RoarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: roar
    settings:
      base:
        PRODUCT_NAME: RoarTests
        PRODUCT_BUNDLE_IDENTIFIER: io.myers.roar.tests
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GENERATE_INFOPLIST_FILE: YES

schemes:
  roar:
    build:
      targets:
        roar: all
        RoarTests: [test]
    test:
      targets:
        - RoarTests
